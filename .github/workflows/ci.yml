name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Install GBDK-2020 (compiles the exported C code in the tests)
        run: |
          curl -sSL https://github.com/gbdk-2020/gbdk-2020/releases/download/4.3.0/gbdk-linux64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "GBDK_HOME=$RUNNER_TEMP/gbdk/" >> "$GITHUB_ENV"
      - name: Install ffmpeg (decodes the FLAC export in the tests)
        run: ffmpeg -version || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: npm test
        env:
          # Cross-check the XM/MOD exports with libopenmpt (the OpenMPT engine, via the chiptune3 package).
          OPENMPT: '1'
          # Require the ffmpeg round trip of the FLAC export.
          FFMPEG: '1'
      - run: npm run build

  browsers:
    name: Browser smoke test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Playwright's image has the browsers and their system libraries, so no step waits on
    # apt mirrors or the browser CDN. Keep its tag at the playwright version in package.json.
    # The runner's user (1001) owns the workspace; Firefox also refuses to run as root.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host
    # A hung browser must fail the run, not hold it for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke -- smoke-screenshots --${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-screenshots-${{ matrix.browser }}
          path: smoke-screenshots/
